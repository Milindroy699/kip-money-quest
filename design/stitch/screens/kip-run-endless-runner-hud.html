<!-- INTERACTIVE RUNNER SCRIPT (Tactile Lane Switching & Coin Feedback) -->
<script>
  (function initEndlessRunner() {
    let currentLane = 1; // 0 = Left, 1 = Center, 2 = Right
    const kip = document.getElementById('kip-runner');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    const laneOffsets = ['-110px', '0px', '110px'];

    function updateLane() {
      if (!kip) return;
      const xOffset = laneOffsets[currentLane];
      kip.style.transform = `translate(calc(-50% + ${xOffset}), 0) scale(1)`;
    }

    if (btnLeft) {
      btnLeft.addEventListener('click', () => {
        if (currentLane > 0) {
          currentLane -= 1;
          updateLane();
        }
      });
    }

    if (btnRight) {
      btnRight.addEventListener('click', () => {
        if (currentLane < 2) {
          currentLane += 1;
          updateLane();
        }
      });
    }

    // Touch swipe support on screen
    let touchStartX = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const diffX = touchEndX - touchStartX;
      if (Math.abs(diffX) > 40) {
        if (diffX < 0 && currentLane > 0) {
          currentLane -= 1;
          updateLane();
        } else if (diffX > 0 && currentLane < 2) {
          currentLane += 1;
          updateLane();
        }
      }
    }, { passive: true });
  })();
</script></main></body></html>
