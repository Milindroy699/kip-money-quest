<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Snowball Valley · Endless Runner Gameplay</title>
<!-- Google Fonts: Space Grotesk & Outfit -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Space Grotesk"', 'sans-serif'],
            body: ['"Outfit"', 'sans-serif'],
          },
          colors: {
            brand: {
              mint: '#00FFA3',
              mintDark: '#00C87E',
              mintShadow: '#008F59',
              gold: '#FFC837',
              goldDark: '#D49B0D',
              purple: '#A855F7',
              purpleDeep: '#6B21A8',
              navyDeep: '#080E1B',
            }
          }
        }
      }
    }
  </script>
<style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050914;
      font-family: 'Outfit', sans-serif;
      color: #F1F5F9;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Device frame wrapper for 390 x 844 */
    .mobile-container {
      width: 390px;
      height: 844px;
      position: relative;
      overflow: hidden;
      background: #070D1E;
      border-radius: 44px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 10px #1e2638;
      display: flex;
      flex-direction: column;
    }

    /* Perspective 3D Runner World */
    .runner-world {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* 3D Track Perspective */
    .perspective-stage {
      position: absolute;
      inset: 0;
      perspective: 460px;
      perspective-origin: 50% 32%;
    }

    .track-plane {
      position: absolute;
      top: 36%;
      left: -12%;
      width: 124%;
      height: 72%;
      transform: rotateX(66deg);
      transform-origin: top center;
      background: linear-gradient(180deg, #162a4a 0%, #1f385c 40%, #244673 80%, #2b558b 100%);
      box-shadow: inset 0 0 50px rgba(0, 20, 50, 0.7);
    }

    /* Lane stripes */
    .lane-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.45) 0px, rgba(255, 255, 255, 0.45) 24px, transparent 24px, transparent 48px);
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
    }

    /* 3D Chunky Mechanical Button */
    .btn-chunky-green {
      background: #00FFA3;
      color: #042416;
      border-radius: 18px;
      font-weight: 700;
      box-shadow: 0 5px 0 #009E63, 0 10px 24px rgba(0, 255, 163, 0.35);
      transition: all 0.1s ease;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-chunky-green:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #009E63, 0 4px 12px rgba(0, 255, 163, 0.3);
    }

    /* Frosted navy glass chips */
    .glass-chip {
      background: rgba(13, 22, 39, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    /* Kip character cutout container */
    .kip-cutout {
      position: absolute;
      width: 86px;
      height: 98px;
      left: 152px; /* Center lane */
      bottom: 120px;
      z-index: 25;
      filter: drop-shadow(0 14px 16px rgba(0, 0, 0, 0.75));
    }

    /* Snowball companion */
    .rolling-snowball {
      position: absolute;
      width: 58px;
      height: 58px;
      left: 96px; /* Rolls beside Kip */
      bottom: 114px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #d8ecf8 45%, #9ec5e4 80%, #689bc2 100%);
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.65), inset -3px -3px 8px rgba(100, 160, 210, 0.6), inset 3px 3px 6px #ffffff;
      z-index: 24;
      animation: gentle-bob 1.8s ease-in-out infinite alternate;
    }

    @keyframes gentle-bob {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-4px) rotate(15deg); }
    }

    /* Melt purple mist animation along bottom edge */
    .melt-fog-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 110px;
      background: linear-gradient(0deg, rgba(88, 28, 135, 0.85) 0%, rgba(126, 34, 206, 0.45) 50%, rgba(168, 85, 247, 0) 100%);
      pointer-events: none;
      z-index: 20;
    }

    /* Tap target helper */
    .lane-touch-control {
      touch-action: manipulation;
      min-height: 48px;
    }
  </style>
</head>
<body>
<!-- 390 x 844 iPhone Viewport Frame -->

              CASH OUT
            </span>
<span class="font-heading text-[11px] font-extrabold text-[#FFFBEB] drop-shadow-sm mt-0.5">
              +15 🪙
            </span>
</div>
<!-- Ramp underside / shadow -->
<div class="w-full h-3 bg-[#78350F] rounded-b-md"></div>
<div class="w-20 h-2.5 bg-amber-500/30 rounded-full blur-[3px] mx-auto mt-0.5"></div>
</div>
