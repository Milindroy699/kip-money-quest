<!-- Lightweight Micro-Interaction Script for Single Selection -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const labels = document.querySelectorAll('label[role="none"], section[role="radiogroup"] label');
      labels.forEach(label => {
        label.addEventListener('click', () => {
          labels.forEach(l => {
            l.classList.remove('border-2', 'border-white', 'ring-2', 'ring-white/60', 'shadow-[0_0_20px_rgba(107,255,182,0.25)]');
            l.classList.add('border', 'border-white/10');
            const radioInner = l.querySelector('.w-6.h-6');
            if (radioInner) {
              radioInner.className = 'w-6 h-6 rounded-full border-2 border-white/20 group-hover:border-white/40';
              radioInner.innerHTML = '';
            }
            const textHeading = l.querySelector('.font-headline-sm.tracking-tight');
            if (textHeading) {
              textHeading.classList.remove('text-white', 'font-bold');
              textHeading.classList.add('text-on-surface-variant', 'font-semibold');
            }
          });

          label.classList.remove('border', 'border-white/10');
          label.classList.add('border-2', 'border-white', 'ring-2', 'ring-white/60', 'shadow-[0_0_20px_rgba(107,255,182,0.25)]');
          
          const activeRadio = label.querySelector('.w-6.h-6');
          if (activeRadio) {
            activeRadio.className = 'w-6 h-6 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-[0_0_8px_rgba(56,227,153,0.8)]';
            activeRadio.innerHTML = '<span class="material-symbols-outlined text-[16px] font-black">check</span>';
          }

          const activeText = label.querySelector('.font-headline-sm.tracking-tight');
          if (activeText) {
            activeText.classList.remove('text-on-surface-variant', 'font-semibold');
            activeText.classList.add('text-white', 'font-bold');
          }
        });
      });
    });
  </script>
