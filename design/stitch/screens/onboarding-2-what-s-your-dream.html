<script>
  function selectGoal(buttonElement) {
    const allGoals = document.querySelectorAll('.goal-card');
    allGoals.forEach(card => {
      card.setAttribute('aria-checked', 'false');
      card.classList.remove('bg-surface-container/90', 'ring-2', 'ring-primary-container', 'shadow-xl', 'shadow-primary-container/20');
      card.classList.add('bg-surface-container/60');
      
      const title = card.querySelector('span.font-headline-sm');
      if (title) {
        title.classList.remove('text-primary-fixed');
        title.classList.add('text-on-surface');
      }

      const iconBox = card.querySelector('div:first-child');
      if (iconBox) {
        iconBox.classList.remove('bg-primary-container/20');
        iconBox.classList.add('bg-surface-container-high/80');
      }

      const check = card.querySelector('.check-icon');
      if (check) {
        check.classList.add('hidden');
        check.classList.remove('flex');
      }
    });

    buttonElement.setAttribute('aria-checked', 'true');
    buttonElement.classList.remove('bg-surface-container/60');
    buttonElement.classList.add('bg-surface-container/90', 'ring-2', 'ring-primary-container', 'shadow-xl', 'shadow-primary-container/20');

    const activeTitle = buttonElement.querySelector('span.font-headline-sm');
    if (activeTitle) {
      activeTitle.classList.remove('text-on-surface');
      activeTitle.classList.add('text-primary-fixed');
    }

    const activeIconBox = buttonElement.querySelector('div:first-child');
    if (activeIconBox) {
      activeIconBox.classList.remove('bg-surface-container-high/80');
      activeIconBox.classList.add('bg-primary-container/20');
    }

    const activeCheck = buttonElement.querySelector('.check-icon');
    if (activeCheck) {
      activeCheck.classList.remove('hidden');
      activeCheck.classList.add('flex');
    }
  }

  function selectAge(pill, age) {
    const allPills = document.querySelectorAll('.age-pill');
    allPills.forEach(p => {
      p.className = 'age-pill flex-1 py-2 px-3 rounded-full bg-surface-container-high/60 backdrop-blur-md text-on-surface-variant font-label-btn text-label-btn text-center active:scale-95 transition-all';
    });

    pill.className = 'age-pill flex-1 py-2 px-3 rounded-full bg-primary-container text-on-primary-container shadow-[0_0_12px_rgba(56,227,153,0.45)] font-label-btn text-label-btn text-center active:scale-95 transition-all font-bold';
    
    const futureLabel = document.getElementById('future-label');
    if (futureLabel) {
      futureLabel.textContent = 'Age ' + age;
    }
  }

  function confirmSelection() {
    const btn = document.getElementById('continue-button');
    if (btn) {
      btn.style.transform = 'translateY(3px)';
      setTimeout(() => {
        btn.style.transform = 'translateY(0px)';
      }, 150);
    }
  }
